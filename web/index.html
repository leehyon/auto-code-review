<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码审查 Dashboard</title>
<style>
/* ============================================================
   设计令牌
   ============================================================ */
:root {
  --ivory:    #FAF9F5;   /* 页面底色：暖白纸感 */
  --slate:    #141413;   /* 正文 */
  --clay:     #D97757;   /* 唯一强调色 */
  --oat:      #E3DACC;   /* 浅色块 */
  --olive:    #788C5D;   /* 良好 */
  --rust:     #B04A3F;   /* 风险 */
  --gray-100: #F0EEE6;
  --gray-300: #D1CFC5;
  --gray-500: #87867F;
  --gray-700: #3D3D3A;
  --white:    #FFFFFF;

  --serif: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
  --sans:  system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono:  ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --radius-panel: 12px;
  --radius-row:   8px;
  --border:   1.5px solid var(--gray-300);
  --hairline: 1px solid var(--gray-300);
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  padding: 48px 24px 96px;
  background: var(--ivory);
  color: var(--slate);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.page { max-width: 1240px; margin: 0 auto; }

.hidden { display: none !important; }

/* ============================================================
   页头
   ============================================================ */
header { margin-bottom: 36px; }

.header-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 6px;
}

/* 标题块：主标题 + 悬挂对齐的副标题 */
.title-block { min-width: 0; }

/* 刊头：拉丁文标题用衬线。Georgia 是为屏幕渲染设计的衬线——
   x 高度大、衬线结实，大字号下比 Times 更有分量，且不需要外部字体。
   收紧字距让刊头更紧凑，避免大字号衬线显得松散。 */
h1 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 40px;
  letter-spacing: -0.025em;
  line-height: 1.1;
  margin: 0;
}

.subtitle {
  color: var(--gray-500);
  font-size: 13.5px;
  margin: 7px 0 0;
}

.pill {
  display: inline-flex;
  align-items: baseline;
  gap: 9px;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--gray-500);
  background: var(--gray-100);
  border: var(--border);
  border-radius: 999px;
  padding: 5px 13px;
  white-space: nowrap;
}

.pill-key { font-family: var(--sans); }
#lastUpdate { font-family: var(--mono); }

/* ============================================================
   区块
   ============================================================ */
section { margin-bottom: 40px; }

h2 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 21px;
  letter-spacing: -0.01em;
  margin: 0 0 14px;
}

hr.rule {
  border: none;
  border-top: var(--hairline);
  margin: 0 0 20px;
}

/* ============================================================
   筛选器
   ============================================================ */
.filters {
  background: var(--white);
  border: var(--border);
  border-radius: var(--radius-panel);
  padding: 22px 24px 20px;
}

.filter-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.field-label {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--gray-500);
  margin-bottom: 6px;
}

input[type="date"], select {
  width: 100%;
  font-family: var(--sans);
  font-size: 13px;
  padding: 8px 10px;
  border: 1.5px solid var(--gray-300);
  border-radius: var(--radius-row);
  background: var(--white);
  color: var(--slate);
}

input[type="date"]:focus, select:focus, .btn:focus-visible {
  outline: 2px solid var(--clay);
  outline-offset: 1px;
  border-color: var(--clay);
}

.filter-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 20px;
  padding-top: 18px;
  border-top: var(--hairline);
}

.segmented {
  display: inline-flex;
  border: 1.5px solid var(--gray-300);
  border-radius: var(--radius-row);
  overflow: hidden;
  background: var(--white);
}

.segmented label {
  padding: 8px 16px;
  font-size: 13px;
  color: var(--gray-700);
  cursor: pointer;
  border-right: 1.5px solid var(--gray-300);
  transition: background 120ms ease, color 120ms ease;
}

.segmented label:last-child { border-right: none; }
.segmented label:hover { background: var(--gray-100); }
.segmented label:has(input:checked) { background: var(--slate); color: var(--white); }
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented label:has(input:focus-visible) { outline: 2px solid var(--clay); outline-offset: -2px; }

.buttons { display: flex; gap: 10px; }

.btn {
  font-family: var(--sans);
  font-size: 13px;
  padding: 8px 20px;
  border-radius: var(--radius-row);
  border: 1.5px solid var(--gray-300);
  background: var(--white);
  color: var(--slate);
  cursor: pointer;
  transition: border-color 120ms ease, background 120ms ease;
}

.btn:hover { border-color: var(--gray-500); }
.btn.primary { background: var(--slate); border-color: var(--slate); color: var(--white); }
.btn.primary:hover { background: var(--gray-700); border-color: var(--gray-700); }

.notice {
  background: var(--oat);
  border-radius: var(--radius-row);
  padding: 11px 14px;
  font-size: 13px;
  color: var(--slate);
  margin-top: 16px;
}

/* ============================================================
   统计条
   ============================================================ */
.stat-band {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

.stat-card {
  background: var(--white);
  border: var(--border);
  border-radius: var(--radius-panel);
  padding: 20px 22px 18px;
}

/* 强调边只用于「需要注意」的状态，不是装饰 */
.stat-card.accent { border-left: 4px solid var(--clay); padding-left: 19px; }

.stat-num {
  display: block;
  font-family: var(--serif);
  font-size: 40px;
  font-weight: 500;
  line-height: 1;
  color: var(--slate);
  margin-bottom: 8px;
}

.stat-label {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--gray-500);
}

/* ============================================================
   标签页
   ============================================================ */
.tabs {
  display: flex;
  gap: 26px;
  border-bottom: var(--hairline);
  margin-bottom: 22px;
}

.tab-button {
  font-family: var(--serif);
  font-size: 18px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  padding: 0 0 10px;
  color: var(--gray-500);
  cursor: pointer;
  transition: color 120ms ease, border-color 120ms ease;
}

.tab-button:hover { color: var(--slate); }
.tab-button.active { color: var(--slate); border-bottom-color: var(--clay); }

/* ============================================================
   表格
   ============================================================ */
.table-wrap {
  background: var(--white);
  border: var(--border);
  border-radius: var(--radius-panel);
  overflow: hidden;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  min-width: 940px;
}

thead th {
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--gray-500);
  background: var(--gray-100);
  padding: 11px 16px;
  border-bottom: var(--hairline);
  white-space: nowrap;
}

tbody td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--gray-100);
  font-size: 13px;
  vertical-align: middle;
}

tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--ivory); }

td.mono { font-family: var(--mono); font-size: 12px; }
td.muted { color: var(--gray-500); font-size: 12px; }
td.author { color: var(--gray-700); }
td.commit { color: var(--slate); max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* PR 链接列：编号用 mono，像报刊的交叉引用 */
.pr-link {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--clay);
  text-decoration: none;
  border-bottom: 1px dotted transparent;
  white-space: nowrap;
}
.pr-link:hover { border-bottom-color: var(--clay); }

/* 这些列不折行：折行会让一眼扫读变成逐行确认 */
td.nowrap { white-space: nowrap; }
td.branch { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.score { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 13px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.dot.good { background: var(--olive); }
.dot.mid  { background: var(--clay); }
.dot.bad  { background: var(--rust); }

.link {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--clay);
  text-decoration: none;
  border-bottom: 1px dotted transparent;
  white-space: nowrap;
}
.link:hover { border-bottom-color: var(--clay); }

.empty {
  padding: 44px 16px;
  text-align: center;
  color: var(--gray-500);
  font-size: 13px;
}

/* ============================================================
   图表
   ============================================================ */
.chart-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.chart-panel {
  background: var(--white);
  border: var(--border);
  border-radius: var(--radius-panel);
  padding: 22px 24px 20px;
}

.chart-panel.wide { grid-column: 1 / -1; }

.chart-title {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 500;
  margin: 0 0 4px;
}

.chart-caption {
  font-size: 12px;
  color: var(--gray-500);
  margin: 0 0 16px;
}

.bars { display: flex; flex-direction: column; gap: 11px; }

.bar-row {
  display: grid;
  grid-template-columns: minmax(90px, 190px) 1fr 54px;
  align-items: center;
  gap: 14px;
}

.bar-label {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--gray-700);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bar-track {
  height: 8px;
  background: var(--gray-100);
  border-radius: 999px;
  overflow: hidden;
}

.bar-fill {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--clay);
  transition: width 200ms ease;
}

.bar-fill.good { background: var(--olive); }
.bar-fill.mid  { background: var(--clay); }
.bar-fill.bad  { background: var(--rust); }

.bar-value {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--gray-700);
  text-align: right;
}

.no-data { font-size: 13px; color: var(--gray-500); padding: 12px 0; }

/* ============================================================
   页脚
   ============================================================ */
.page-footer {
  margin-top: 44px;
  padding-top: 18px;
  border-top: var(--hairline);
}

/* 版权署名行：团队标识和版权同一条基线，是报纸尾栏的做法 */
.footer-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 24px;
}

.footer-team {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--slate);
}

.footer-copy {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--gray-500);
  white-space: nowrap;
}

.footer-desc {
  color: var(--gray-500);
  font-size: 13px;
  margin: 7px 0 0;
  max-width: 52ch;
}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width: 900px) {
  .filter-grid { grid-template-columns: repeat(2, 1fr); }
  .stat-band { grid-template-columns: repeat(2, 1fr); }
  .chart-grid { grid-template-columns: 1fr; }
}

@media (max-width: 560px) {
  body { padding: 28px 16px 64px; }
  .filter-grid { grid-template-columns: 1fr; }
  .stat-band { grid-template-columns: 1fr; }
  h1 { font-size: 26px; }
  .stat-num { font-size: 32px; }
  .footer-head { flex-direction: column; align-items: flex-start; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="header-top">
      <div class="title-block">
        <h1>Code Review</h1>
        <p class="subtitle">Merge Request 与 Push 的自动审查记录</p>
      </div>
      <span class="pill"><span class="pill-key">最后更新</span><span id="lastUpdate">—</span></span>
    </div>
  </header>

  <!-- 筛选器 -->
  <section class="filters">
    <div class="filter-grid">
      <div>
        <label class="field-label" for="startDate">开始日期</label>
        <input type="date" id="startDate">
      </div>
      <div>
        <label class="field-label" for="endDate">结束日期</label>
        <input type="date" id="endDate">
      </div>
      <div>
        <label class="field-label" for="authors">作者</label>
        <select id="authors"><option value="">全部</option></select>
      </div>
      <div>
        <label class="field-label" for="projectNames">项目</label>
        <select id="projectNames"><option value="">全部</option></select>
      </div>
    </div>

    <div class="filter-actions">
      <div class="segmented" role="radiogroup" aria-label="审查类型">
        <label><input type="radio" id="typeMr" name="reviewType" value="mr" checked> Merge Request</label>
        <label><input type="radio" id="typePush" name="reviewType" value="push"> Push</label>
      </div>
      <div class="buttons">
        <button class="btn primary" onclick="loadData()">查询</button>
        <button class="btn" onclick="resetFilters()">重置</button>
      </div>
    </div>

    <div id="filterNotice" class="notice hidden"></div>
  </section>

  <!-- 统计条 -->
  <section>
    <div class="stat-band">
      <div class="stat-card">
        <span class="stat-num" id="totalRecords">0</span>
        <span class="stat-label">审查记录</span>
      </div>
      <div class="stat-card" id="averageScoreCard">
        <span class="stat-num" id="averageScore">0.00</span>
        <span class="stat-label">平均分数</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statProjects">0</span>
        <span class="stat-label">涉及项目</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statAuthors">0</span>
        <span class="stat-label">参与人数</span>
      </div>
    </div>
  </section>

  <!-- 记录 / 统计 -->
  <section>
    <nav class="tabs">
      <button class="tab-button active" onclick="switchTab('data')" id="tabData">记录</button>
      <button class="tab-button" onclick="switchTab('charts')" id="tabCharts">统计</button>
    </nav>

    <div id="tabContentData" class="tab-content">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>项目</th>
              <th>作者</th>
              <th id="branchHeader">源分支</th>
              <th>更新时间</th>
              <th>提交信息</th>
              <th>代码变更</th>
              <th>分数</th>
              <th id="urlHeader">链接</th>
            </tr>
          </thead>
          <tbody id="dataTableBody">
            <tr><td colspan="8" class="empty">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="tabContentCharts" class="tab-content hidden">
      <div class="chart-grid">
        <div class="chart-panel">
          <h3 class="chart-title">项目提交次数</h3>
          <p class="chart-caption">当前筛选范围内的审查数量</p>
          <div class="bars" id="projectCountChart"></div>
        </div>
        <div class="chart-panel">
          <h3 class="chart-title">项目平均分数</h3>
          <p class="chart-caption">满分 100，越高表示问题越少</p>
          <div class="bars" id="projectScoreChart"></div>
        </div>
        <div class="chart-panel">
          <h3 class="chart-title">人员提交次数</h3>
          <p class="chart-caption">当前筛选范围内的审查数量</p>
          <div class="bars" id="authorCountChart"></div>
        </div>
        <div class="chart-panel">
          <h3 class="chart-title">人员平均分数</h3>
          <p class="chart-caption">满分 100，越高表示问题越少</p>
          <div class="bars" id="authorScoreChart"></div>
        </div>
        <div class="chart-panel wide">
          <h3 class="chart-title">人员代码变更总行数</h3>
          <p class="chart-caption">新增与删除行数合计</p>
          <div class="bars" id="authorCodeLineChart"></div>
        </div>
      </div>
    </div>
  </section>


  <footer class="page-footer">
    <div class="footer-head">
      <span class="footer-team">SW Team</span>
      <span class="footer-copy">© 2026 Magna Mirrors COE</span>
    </div>
    <p class="footer-desc">基于 AI 的自动代码审查与统计面板，帮助团队提升代码质量</p>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
