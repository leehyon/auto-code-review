<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Review Dashboard</title>
<!-- 内联 SVG 图标：不产生额外请求，内网 / 断网也能显示。
     深色圆角方块 + 象牙白与 clay 双色的 < > ，16px 下也能认出是「代码」。 -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32'><rect width='32' height='32' rx='7' fill='%23141413'/><path d='M13 9.5 7.5 16 13 22.5' fill='none' stroke='%23FAF9F5' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><path d='M19 9.5 24.5 16 19 22.5' fill='none' stroke='%23D97757' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
/* ============================================================
   设计令牌
   ============================================================ */
:root {
  --ivory:    #FAF9F5;   /* 页面底色：暖白纸感 */
  --slate:    #141413;   /* 正文 */
  --clay:     #D97757;   /* 唯一强调色 */
  --oat:      #E3DACC;   /* 浅色块 */
  --olive:    #788C5D;   /* 良好 */
  --rust:     #B04A3F;   /* 风险 */
  --gray-100: #F0EEE6;
  --gray-300: #D1CFC5;
  --gray-500: #87867F;
  --gray-700: #3D3D3A;
  --white:    #FFFFFF;

  --serif: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
  --sans:  system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono:  ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --radius-panel: 12px;
  --radius-row:   8px;
  --border:   1.5px solid var(--gray-300);
  --hairline: 1px solid var(--gray-300);
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  padding: 48px 24px 96px;
  background: var(--ivory);
  color: var(--slate);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.page { max-width: 1240px; margin: 0 auto; }

.hidden { display: none !important; }

/* ============================================================
   页头
   ============================================================ */
header { margin-bottom: 36px; }

.header-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 6px;
}

/* 标题块：主标题 + 悬挂对齐的副标题 */
.title-block { min-width: 0; }

/* 刊头：拉丁文标题用衬线。Georgia 是为屏幕渲染设计的衬线——
   x 高度大、衬线结实，大字号下比 Times 更有分量，且不需要外部字体。
   收紧字距让刊头更紧凑，避免大字号衬线显得松散。 */
h1 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 40px;
  letter-spacing: -0.025em;
  line-height: 1.1;
  margin: 0;
}

.subtitle {
  color: var(--gray-500);
  font-size: 13.5px;
  margin: 7px 0 0;
}

.pill {
  display: inline-flex;
  align-items: baseline;
  gap: 9px;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--gray-500);
  background: var(--gray-100);
  border: var(--border);
  border-radius: 999px;
  padding: 5px 13px;
  white-space: nowrap;
}

.pill-key { font-family: var(--sans); }
#lastUpdate { font-family: var(--mono); }

/* ============================================================
   区块
   ============================================================ */
section { margin-bottom: 40px; }

h2 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 21px;
  letter-spacing: -0.01em;
  margin: 0 0 14px;
}

hr.rule {
  border: none;
  border-top: var(--hairline);
  margin: 0 0 20px;
}

/* ============================================================
   筛选器
   ============================================================ */
.filters {
  background: var(--white);
  border: var(--border);
  border-radius: var(--radius-panel);
  padding: 22px 24px 20px;
}

.filter-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.field-label {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--gray-500);
  margin-bottom: 6px;
}

input[type="date"], select {
  width: 100%;
  font-family: var(--sans);
  font-size: 13px;
  padding: 8px 10px;
  border: 1.5px solid var(--gray-300);
  border-radius: var(--radius-row);
  background: var(--white);
  color: var(--slate);
}

input[type="date"]:focus, select:focus, .btn:focus-visible {
  outline: 2px solid var(--clay);
  outline-offset: 1px;
  border-color: var(--clay);
}

.filter-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 20px;
  padding-top: 18px;
  border-top: var(--hairline);
}

.segmented {
  display: inline-flex;
  border: 1.5px solid var(--gray-300);
  border-radius: var(--radius-row);
  overflow: hidden;
  background: var(--white);
}

.segmented label {
  padding: 8px 16px;
  font-size: 13px;
  color: var(--gray-700);
  cursor: pointer;
  border-right: 1.5px solid var(--gray-300);
  transition: background 120ms ease, color 120ms ease;
}

.segmented label:last-child { border-right: none; }
.segmented label:hover { background: var(--gray-100); }
.segmented label:has(input:checked) { background: var(--slate); color: var(--white); }
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented label:has(input:focus-visible) { outline: 2px solid var(--clay); outline-offset: -2px; }

.buttons { display: flex; gap: 10px; }

.btn {
  font-family: var(--sans);
  font-size: 13px;
  padding: 8px 20px;
  border-radius: var(--radius-row);
  border: 1.5px solid var(--gray-300);
  background: var(--white);
  color: var(--slate);
  cursor: pointer;
  transition: border-color 120ms ease, background 120ms ease;
}

.btn:hover { border-color: var(--gray-500); }
.btn.primary { background: var(--slate); border-color: var(--slate); color: var(--white); }
.btn.primary:hover { background: var(--gray-700); border-color: var(--gray-700); }

.notice {
  background: var(--oat);
  border-radius: var(--radius-row);
  padding: 11px 14px;
  font-size: 13px;
  color: var(--slate);
  margin-top: 16px;
}

/* ============================================================
   统计条
   ============================================================ */
.stat-band {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

.stat-card {
  background: var(--white);
  border: var(--border);
  border-radius: var(--radius-panel);
  padding: 20px 22px 18px;
}

/* 强调边只用于「需要注意」的状态，不是装饰 */
.stat-card.accent { border-left: 4px solid var(--clay); padding-left: 19px; }

/* 可点击的统计卡：审查失败 —— 点它筛出失败行（重试入口就在那些行上） */
.stat-card.clickable { cursor: pointer; transition: border-color .15s, background .15s; }
.stat-card.clickable:hover { border-color: var(--clay); }
.stat-card.clickable.active {
  border-color: var(--clay);
  border-left: 4px solid var(--clay);
  padding-left: 19px;
  background: #FDF6F2;
}
.stat-card.clickable.active .stat-num { color: var(--clay); }

.stat-num {
  display: block;
  font-family: var(--serif);
  font-size: 40px;
  font-weight: 500;
  line-height: 1;
  color: var(--slate);
  margin-bottom: 8px;
}

.stat-label {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--gray-500);
}

/* ============================================================
   标签页
   ============================================================ */
.tabs {
  display: flex;
  gap: 26px;
  border-bottom: var(--hairline);
  margin-bottom: 22px;
}

.tab-button {
  font-family: var(--serif);
  font-size: 18px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  padding: 0 0 10px;
  color: var(--gray-500);
  cursor: pointer;
  transition: color 120ms ease, border-color 120ms ease;
}

.tab-button:hover { color: var(--slate); }
.tab-button.active { color: var(--slate); border-bottom-color: var(--clay); }

/* ============================================================
   表格
   ============================================================ */
.table-wrap {
  background: var(--white);
  border: var(--border);
  border-radius: var(--radius-panel);
  overflow: hidden;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  min-width: 940px;
}

thead th {
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--gray-500);
  background: var(--gray-100);
  padding: 11px 16px;
  border-bottom: var(--hairline);
  white-space: nowrap;
}

tbody td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--gray-100);
  font-size: 13px;
  vertical-align: middle;
}

tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--ivory); }

td.mono { font-family: var(--mono); font-size: 12px; }
td.muted { color: var(--gray-500); font-size: 12px; }
td.author { color: var(--gray-700); }
td.commit { color: var(--slate); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* PR 链接列：编号用 mono，像报刊的交叉引用 */
.pr-link {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--clay);
  text-decoration: none;
  border-bottom: 1px dotted transparent;
  white-space: nowrap;
}
.pr-link:hover { border-bottom-color: var(--clay); }

/* 这些列不折行：折行会让一眼扫读变成逐行确认 */
td.nowrap { white-space: nowrap; }
td.branch { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.score { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 13px; }

/* 状态标记 */
.status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--gray-500);
  white-space: nowrap;
}
.status.failed { color: var(--rust); }
.status.failed .dot { background: var(--rust); }

/* 行内操作按钮：查看 PR、重试 */
.row-action, .retry-btn {
  font-family: var(--sans);
  font-size: 12px;
  padding: 4px 11px;
  border: 1.5px solid var(--gray-300);
  border-radius: 999px;
  background: var(--white);
  color: var(--slate);
  cursor: pointer;
  white-space: nowrap;
  display: inline-block;
  text-decoration: none;
  transition: border-color 120ms ease, background 120ms ease;
}
.row-action:hover, .retry-btn:hover { border-color: var(--clay); color: var(--clay); }
.retry-btn:disabled { opacity: 0.5; cursor: default; }
.row-action:hover:disabled, .retry-btn:hover:disabled { border-color: var(--gray-300); color: var(--slate); }
/* 两个按钮并排时的间距 */
.action-cell .row-action + .row-action,
.action-cell .row-action + .retry-btn,
.action-cell .retry-btn + .row-action { margin-left: 6px; }

/* 操作列：行末放查看/重试按钮，宽度固定，避免列宽随内容跳动 */
.action-col { width: 88px; }
/* 表格有横向滚动条，操作列右固定，重试入口始终可见。
   固定列必须是不透明背景，否则滚动时内容会从下面透出来。
   背景色要跟同列其它单元格一致：表头是灰底（--gray-100），
   表体是白底（--white，.table-wrap 的底色）。 */
th.action-col, td.action-cell {
  position: sticky;
  right: 0;
}
th.action-col { z-index: 2; background: var(--gray-100); }
td.action-cell { text-align: right; background: var(--white); }
tbody tr:hover td.action-cell { background: var(--ivory); }
/* 固定列的左侧分隔线，提示这里是浮在上面的 */
td.action-cell::before, th.action-col::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: -1px;
  width: 1px;
  background: var(--gray-100);
}
.dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.dot.good { background: var(--olive); }
.dot.mid  { background: var(--clay); }
.dot.bad  { background: var(--rust); }

.link {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--clay);
  text-decoration: none;
  border-bottom: 1px dotted transparent;
  white-space: nowrap;
}
.link:hover { border-bottom-color: var(--clay); }

.empty {
  padding: 44px 16px;
  text-align: center;
  color: var(--gray-500);
  font-size: 13px;
}

/* ============================================================
   图表
   ============================================================ */
.chart-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.chart-panel {
  background: var(--white);
  border: var(--border);
  border-radius: var(--radius-panel);
  padding: 22px 24px 20px;
}

.chart-panel.wide { grid-column: 1 / -1; }

.chart-title {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 500;
  margin: 0 0 4px;
}

.chart-caption {
  font-size: 12px;
  color: var(--gray-500);
  margin: 0 0 16px;
}

.bars { display: flex; flex-direction: column; gap: 11px; }

.bar-row {
  display: grid;
  grid-template-columns: minmax(90px, 190px) 1fr 54px;
  align-items: center;
  gap: 14px;
}

.bar-label {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--gray-700);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bar-track {
  height: 8px;
  background: var(--gray-100);
  border-radius: 999px;
  overflow: hidden;
}

.bar-fill {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--clay);
  transition: width 200ms ease;
}

.bar-fill.good { background: var(--olive); }
.bar-fill.mid  { background: var(--clay); }
.bar-fill.bad  { background: var(--rust); }

/* 人员代码变更总行数：每个人一个固定颜色。
   按名字哈希取色，同一个人在任何筛选条件下都是同一个颜色；
   撞色了就往后挪一格，避免两个人同色。 */
.bar-fill.c0 { background: #D97757; }  /* 陶土 */
.bar-fill.c1 { background: #4A7C8C; }  /* 青蓝 */
.bar-fill.c2 { background: #788C5D; }  /* 橄榄 */
.bar-fill.c3 { background: #8A6A8F; }  /* 梅紫 */
.bar-fill.c4 { background: #B08D57; }  /* 赭石 */
.bar-fill.c5 { background: #B04A3F; }  /* 砖红 */
.bar-fill.c6 { background: #5F7FA6; }  /* 雾蓝 */
.bar-fill.c7 { background: #6E7B5A; }  /* 卡其 */

.bar-value {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--gray-700);
  text-align: right;
}

.no-data { font-size: 13px; color: var(--gray-500); padding: 12px 0; }

/* ============================================================
   页脚
   ============================================================ */
.page-footer {
  margin-top: 44px;
  padding-top: 18px;
  border-top: var(--hairline);
}

/* 页脚：logo 在左并跨两行，署名和描述在中间，版权在右下角。
   用 grid 而不是 flex，是为了让描述行的左边缘跟「SW Team」对齐，
   并让版权跟描述共用一条基线——版权是「最后一行」的元素，
   放在顶部会跟 SW TEAM 看成平级，而它们并不是平级关系。
   align-items:baseline 让同一行里的文字按基线对齐，而不是按顶边。 */
.page-footer {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-areas:
    "logo team ."
    "logo desc copy";
  align-items: baseline;
  column-gap: 20px;
  row-gap: 4px;
}

.footer-logo {
  grid-area: logo;
  /* 高度取右边两行文字（44px）的 80%，视觉上呼应但略小一号，
     不跟文字抢注意力。原始比例 300/66，width:auto 会自动等比。
     align-self:center 让它在这个高度下仍与文字块居中对齐。 */
  align-self: center;
  height: 35px;
  width: auto;
  object-fit: contain;
}

.footer-team {
  grid-area: team;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--slate);
  margin: 0;
}

.footer-copy {
  grid-area: copy;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--gray-500);
  white-space: nowrap;
  margin: 0;
}

.footer-desc {
  grid-area: desc;
  color: var(--gray-500);
  font-size: 13px;
  margin: 0;
  max-width: 52ch;
}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width: 900px) {
  .filter-grid { grid-template-columns: repeat(2, 1fr); }
  .stat-band { grid-template-columns: repeat(2, 1fr); }
  .chart-grid { grid-template-columns: 1fr; }
}

@media (max-width: 560px) {
  body { padding: 28px 16px 64px; }
  .filter-grid { grid-template-columns: 1fr; }
  .stat-band { grid-template-columns: 1fr; }
  h1 { font-size: 26px; }
  .stat-num { font-size: 32px; }
  .page-footer {
    grid-template-columns: 1fr;
    grid-template-areas:
      "logo"
      "team"
      "desc"
      "copy";
    row-gap: 8px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="header-top">
      <div class="title-block">
        <h1>Code Review</h1>
        <p class="subtitle">Merge Request 与 Push 的自动审查记录</p>
      </div>
      <span class="pill"><span class="pill-key">最后更新</span><span id="lastUpdate">—</span></span>
    </div>
  </header>

  <!-- 筛选器 -->
  <section class="filters">
    <div class="filter-grid">
      <div>
        <label class="field-label" for="startDate">开始日期</label>
        <input type="date" id="startDate">
      </div>
      <div>
        <label class="field-label" for="endDate">结束日期</label>
        <input type="date" id="endDate">
      </div>
      <div>
        <label class="field-label" for="authors">作者</label>
        <select id="authors"><option value="">全部</option></select>
      </div>
      <div>
        <label class="field-label" for="projectNames">项目</label>
        <select id="projectNames"><option value="">全部</option></select>
      </div>
    </div>

    <div class="filter-actions">
      <div class="segmented" role="radiogroup" aria-label="审查类型">
        <label><input type="radio" id="typeMr" name="reviewType" value="mr" checked> Merge Request</label>
        <label><input type="radio" id="typePush" name="reviewType" value="push"> Push</label>
      </div>
      <div class="buttons">
        <button class="btn primary" onclick="loadData()">查询</button>
        <button class="btn" onclick="resetFilters()">重置</button>
      </div>
    </div>

    <div id="filterNotice" class="notice hidden"></div>
  </section>

  <!-- 统计条 -->
  <section>
    <div class="stat-band">
      <div class="stat-card">
        <span class="stat-num" id="totalRecords">0</span>
        <span class="stat-label">审查记录</span>
      </div>
      <div class="stat-card" id="averageScoreCard">
        <span class="stat-num" id="averageScore">0.00</span>
        <span class="stat-label">平均分数</span>
      </div>
      <div class="stat-card clickable" id="failedCard" onclick="toggleFailedFilter()"
           title="点击只看失败的审查（有重试入口的行）">
        <span class="stat-num" id="statFailed">0</span>
        <span class="stat-label">审查失败</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="statAuthors">0</span>
        <span class="stat-label">参与人数</span>
      </div>
    </div>
  </section>

  <!-- 记录 / 统计 -->
  <section>
    <nav class="tabs">
      <button class="tab-button active" onclick="switchTab('data')" id="tabData">记录</button>
      <button class="tab-button" onclick="switchTab('charts')" id="tabCharts">统计</button>
    </nav>

    <div id="tabContentData" class="tab-content">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>项目</th>
              <th>作者</th>
              <th id="branchHeader">源分支</th>
              <th>更新时间</th>
              <th>提交信息</th>
              <th>代码变更</th>
              <th>分数</th>
              <th>状态</th>
              <th id="urlHeader">链接</th>
