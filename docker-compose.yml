services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.10-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple/}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-mirrors.aliyun.com}
    ports:
      - "5001:5001"
      - "5002:5002"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config/prompt_templates.yml:/app/config/prompt_templates.yml
    env_file:
      - ./config/.env
    restart: unless-stopped